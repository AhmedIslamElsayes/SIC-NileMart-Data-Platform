name: NileMart Streaming CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - "streaming/**"
      - ".github/workflows/streaming-ci.yml"
  workflow_dispatch:

jobs:
  python-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q streaming/producer.py streaming/consumer.py

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nilemart-streaming:test ./streaming

  acr-push:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/streaming-container-apps'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name caa30300af8facr

      - name: Build Docker image
        run: docker build -t caa30300af8facr.azurecr.io/nilemart-streaming:${{ github.sha }} ./streaming

      - name: Push Docker image
        run: docker push caa30300af8facr.azurecr.io/nilemart-streaming:${{ github.sha }}
