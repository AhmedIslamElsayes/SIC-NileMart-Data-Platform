name: NileMart Streaming ACR Push

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name caa30300af8facr

      - name: Build Docker image
        run: docker build -t caa30300af8facr.azurecr.io/nilemart-streaming:${{ github.sha }} ./streaming

      - name: Push Docker image
        run: docker push caa30300af8facr.azurecr.io/nilemart-streaming:${{ github.sha }}
